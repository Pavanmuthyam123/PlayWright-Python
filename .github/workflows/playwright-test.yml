name: Playwright Python Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-playwright-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v5


      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # 3. Install project dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 4. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # 5. Create Gmail authentication files from GitHub Secrets
      - name: Configure Gmail authentication
        shell: bash
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json

          echo "Gmail authentication files created."


      # 6. Verify Gmail authentication files exist
      - name: Verify Gmail authentication setup
        shell: bash
        run: |
          test -f credentials.json
          test -f token.json

          echo "credentials.json exists"
          echo "token.json exists"


      # 7. Create report directories
      - name: Create report directories
        run: |
          mkdir -p reports/screenshots


      # 8. Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall pages tests utils conftest.py


      # 9. Verify E2E test discovery
      - name: Collect E2E Playwright test
        run: |
          python -m pytest tests/test_ticket_e2e.py --collect-only -q


      # 10. Execute complete E2E Playwright test
      - name: Run Complete Ticket E2E Test
        env:
          HEADLESS: "true"
        run: |
          python -m pytest tests/test_ticket_e2e.py \
            -v \
            --browser chromium \
            --html=reports/report.html \
            --self-contained-html


      # 11. Upload HTML report and screenshots
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            reports/report.html
            reports/screenshots/
          if-no-files-found: warn
          retention-days: 14


      # 12. Remove sensitive Gmail files
      - name: Cleanup Gmail authentication files
        if: always()
        shell: bash
        run: |
          rm -f credentials.json
          rm -f token.json

          echo "Sensitive Gmail files removed."