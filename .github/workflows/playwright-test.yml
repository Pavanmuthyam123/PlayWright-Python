name: Playwright Python Tests

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Get source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # 3. Install project dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Chromium for Playwright
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 5. Create report folders
      - name: Create report directories
        run: |
          mkdir -p reports/screenshots

      # 6. Check Python syntax before running tests
      - name: Check Python syntax
        run: |
          python -m compileall pages tests utils conftest.py

      # 7. Verify pytest can discover the tests
      - name: Collect Playwright tests
        run: |
          python -m pytest tests --collect-only

      # 8. Run Playwright tests and generate HTML report
      - name: Run Playwright tests
        run: |
          python -m pytest tests \
            --browser chromium \
            -v \
            --html=reports/report.html \
            --self-contained-html

      # 9. Upload HTML report and screenshots
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            reports/report.html
            reports/screenshots/
          if-no-files-found: warn
          retention-days: 14